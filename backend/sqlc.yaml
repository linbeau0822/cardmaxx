version: "2"
sql:
  - engine: "postgresql"
    # The migrations are the single source of truth for the schema; sqlc reads
    # them directly (it ignores *.down.sql) so generated code can never drift
    # from what golang-migrate applied.
    schema: "migrations"
    queries: "sql/queries"
    gen:
      go:
        package: "db"
        out: "internal/database/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        json_tags_case_style: "snake"
        # Nullable columns become *T instead of pgtype wrappers, which keeps the
        # generated models usable as-is in service code and JSON responses.
        emit_pointers_for_null_types: true
        emit_empty_slices: true
        # Generates the Querier interface, which services depend on so they can
        # be unit tested without a database.
        emit_interface: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "date"
            go_type: "time.Time"
