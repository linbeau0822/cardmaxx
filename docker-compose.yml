# Local development dependencies only. The Go backend and React frontend are
# run directly on the host (see Makefile) so iteration stays fast.
services:
  postgres:
    image: postgres:17-alpine
    container_name: cardwise-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cardwise
      POSTGRES_PASSWORD: cardwise
      POSTGRES_DB: cardwise
    ports:
      # Host port is configurable so the container does not clash with a
      # PostgreSQL already installed on the host. Keep DATABASE_URL in sync.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cardwise -d cardwise"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
